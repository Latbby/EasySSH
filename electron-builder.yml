appId: com.easyssh.app
productName: EasySSH
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 打包后把产物的强制完整性标签重置为 Medium：构建若发生在被 Windows 沙箱打过
# Low 标签的目录下（工作区内新建文件会继承该标签），exe 带 Low 标签会让进程被降到
# Low 完整性级别，Chromium 沙箱无法初始化，双击表现为毫无反应。详见该脚本注释。
afterPack: ./scripts/after-pack.cjs
# 启动器随包分发，作为兜底：产物完整性标签无法重置时，双击 exe 会被降级为 Low 完整性
# 级别并在创建窗口前静默退出，此时可用 start.bat / start.lnk（带 --no-sandbox）启动。
# 标签正常时直接双击 exe 即可，见 scripts/after-pack.cjs。
# start.lnk 由 scripts/make-start-lnk.ps1 在打包前按当前仓库位置生成（不入库：内部是绝对路径），
# 内部记录的是相对路径，因此整目录移动后依然有效。
# 注意：bat 必须保持纯 ASCII 内容，中文注释在 cmd 的 GBK 环境下会解析错乱导致脚本整体失效。
win:
  executableName: EasySSH
  # 只产出免安装目录版（zip 会连同 win-unpacked 一起生成）。
  # 未使用 nsis：其构建过程需要实际运行一次生成的 exe 来提取卸载器，受限环境下会失败。
  # 未使用 portable：它启动时要先把应用自解压到 %TEMP% 再执行，容易被安全软件拦截并报
  # "NSIS Error: Error writing temporary file"，不如目录版可靠。
  target:
    - zip
  extraFiles:
    - from: build/start.lnk
      to: start.lnk
    - from: build/start.bat
      to: start.bat
    - from: build/run-debug.bat
      to: run-debug.bat
    # 运行说明随包分发：未签名产物会遇到 SmartScreen 与完整性标签两类"双击没反应"，
    # 说明里给了自查与兜底启动方式，避免用户拿到包后无从下手
    - from: build/运行说明.txt
      to: 运行说明.txt
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
